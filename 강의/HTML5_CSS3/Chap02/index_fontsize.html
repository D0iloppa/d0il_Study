<!DOCTYPE html>
<html>

<head>
	<title>Styling Text!</title>
	<meta charset="utf-8">
	<style type="text/css">
		body {
			font-size: 24px;
		}

		.div1 {
			font-size: 100%;
		}

		.div2 { /*상위 크기의 2배*/
			font-size: 200%;
		}

		.div3 { /*상위 크기의 2배*/
			font-size: 200%;
		}
	</style>

</head>

<body>
	<div class="div1">
		div1
		<div class="div2">
			div2
			<div class="div3">
				div3
			</div>
		</div>
	</div>
</body>

</html>
