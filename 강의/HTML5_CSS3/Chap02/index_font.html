<!DOCTYPE html>
<html>
<head>
	<title>Styling Text!</title>
	<meta charset="utf-8">	
	<style type="text/css">
		p{
			font-size : 32px;
			font-weight: bold;
			text-decoration: underline;
		}

		a{
			text-decoration: none;
		}
		
	</style>

</head>

<body>
  <p>텍스트를 다양하게 스타일링 해봅시다!</p>   
  <a href="http://www.naver.com" target="_blank">네이버로 가는 링크</a>
</body>
</html>
